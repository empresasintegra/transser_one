{% extends "base.html" %}
{% load static %}
{% block title %}Nuevo servicio · Transser One{% endblock %}
{% block page_title %}Registro de servicio{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        <label class="field">Cliente *
          <select name="cliente" required
                  hx-get="{% url 'operaciones:opciones_rutas_cliente' %}"
                  hx-target="#ruta_select" hx-trigger="change" hx-include="this">
            <option value="">Seleccionar...</option>
            {% for c in clientes %}<option value="{{ c.pk|stringformat:"d" }}">{{ c.razon_social }}</option>{% endfor %}
          </select>
        </label>

        <label class="field">Local (opcional)
          <select name="local" id="local_select"
                  hx-get="{% url 'operaciones:opciones_locales_cliente_servicio' %}"
                  hx-target="this" hx-trigger="change from:[name='cliente']" hx-include="[name='cliente']">
            <option value="">Selecciona primero un cliente</option>
          </select>
        </label>

        <label class="field">Ruta *
          <select name="ruta" id="ruta_select" required>
            <option value="">Selecciona primero un cliente</option>
          </select>
        </label>

        <label class="field">Conductor
          <select name="conductor_principal"
                  hx-get="{% url 'catalogos:tracto_de_conductor' %}"
                  hx-target="#tracto-preview" hx-swap="outerHTML" hx-trigger="change" hx-include="this">
            <option value="">Sin asignar</option>
            {% for c in conductores %}<option value="{{ c.nombre }}">{{ c.nombre }}</option>{% endfor %}
          </select>
        </label>
      </div>

      {% include "operaciones/_tarifa_preview.html" %}

      <div class="form-grid">
        <label class="field">Fecha de carga *<input type="date" name="fecha_carga" required></label>
        <label class="field">Entrega estimada<input type="date" name="fecha_entrega_estimada"></label>
        <label class="field">Tracto<input type="text" id="tracto-preview" name="tracto" readonly placeholder="Automático según conductor"></label>
        <label class="field">Rampla<input type="text" name="rampla" placeholder="Ejemplo: HGKB23"></label>
      </div>

      <label class="field full-width">Observaciones<textarea name="observaciones" rows="3"></textarea></label>

      <div class="form-actions">
        <a href="{% url 'operaciones:centro_operaciones' %}" class="button secondary">Cancelar</a>
        <button type="submit" class="button primary">Crear servicio</button>
      </div>
    </form>
  </div>
</section>
<script src="{% static 'js/nuevo-servicio.js' %}?v=1"></script>
{% endblock %}
